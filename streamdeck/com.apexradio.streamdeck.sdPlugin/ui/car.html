<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script src="pi.js"></script></head>
<body>
<div class="row"><label data-fr="Commande" data-en="Command">Commande</label>
<select data-key="cmd">
  <option value="lights" data-fr="Phares" data-en="Headlights">Phares</option>
  <option value="flash" data-fr="Appel de phares" data-en="Flash lights">Appel de phares</option>
  <option value="ignition" data-fr="Contact" data-en="Ignition">Contact</option>
  <option value="starter" data-fr="Démarreur" data-en="Starter">Démarreur</option>
  <option value="limiter" data-fr="Limiteur" data-en="Pit limiter">Limiteur</option>
  <option value="wipers" data-fr="Essuie-glaces" data-en="Wipers">Essuie-glaces</option>
  <option value="neutral" data-fr="Point mort" data-en="Neutral">Point mort</option>
  <option value="pit_request" data-fr="Demande d'arrêt" data-en="Pit request">Demande d'arrêt</option>
  <option value="tc_up" data-fr="TC +" data-en="TC +">TC +</option>
  <option value="tc_down" data-fr="TC −" data-en="TC −">TC −</option>
  <option value="tccut_up" data-fr="TC Cut +" data-en="TC Cut +">TC Cut +</option>
  <option value="tccut_down" data-fr="TC Cut −" data-en="TC Cut −">TC Cut −</option>
  <option value="tcslip_up" data-fr="TC Slip +" data-en="TC Slip +">TC Slip +</option>
  <option value="tcslip_down" data-fr="TC Slip −" data-en="TC Slip −">TC Slip −</option>
  <option value="abs_up" data-fr="ABS +" data-en="ABS +">ABS +</option>
  <option value="abs_down" data-fr="ABS −" data-en="ABS −">ABS −</option>
  <option value="bias_fwd" data-fr="Répartition de freinage vers l'avant" data-en="Brake bias forward">Frein avant</option>
  <option value="bias_rear" data-fr="Répartition de freinage vers l'arrière" data-en="Brake bias rearward">Frein arrière</option>
  <option value="map_up" data-fr="Cartographie moteur +" data-en="Engine map +">Carto +</option>
  <option value="map_down" data-fr="Cartographie moteur −" data-en="Engine map −">Carto −</option>
  <option value="regen_up" data-fr="Régénération +" data-en="Regen +">Régén +</option>
  <option value="regen_down" data-fr="Régénération −" data-en="Regen −">Régén −</option>
</select></div>
<div class="hint" data-fr="Apex appuie sur la touche que tu as réglée dans LMU (Commandes → clavier). La touche affiche l'état réel de la voiture." data-en="Apex presses the key you set in LMU (Controls → keyboard). The key shows the car's real state."></div>
</body></html>
