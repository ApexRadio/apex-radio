<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script src="pi.js"></script></head>
<body>
<div class="row"><label data-fr="Afficher" data-en="Show">Afficher</label>
<select data-key="what">
  <option value="pos" data-fr="Place" data-en="Position">Place</option>
  <option value="fuel" data-fr="Essence (et tours restants)" data-en="Fuel (and laps left)">Essence</option>
  <option value="gap_ahead" data-fr="Écart avec la voiture devant" data-en="Gap to car ahead">Devant</option>
  <option value="gap_behind" data-fr="Écart avec la voiture derrière" data-en="Gap to car behind">Derrière</option>
  <option value="box" data-fr="Tours avant le box" data-en="Laps until box">Box</option>
  <option value="last" data-fr="Dernier tour" data-en="Last lap">Dernier tour</option>
  <option value="best" data-fr="Meilleur tour" data-en="Best lap">Meilleur tour</option>
</select></div>
<div class="hint" data-fr="Appuie sur la touche : l'ingénieure te le dit à la radio." data-en="Press the key: the engineer tells you on the radio."></div>
</body></html>
